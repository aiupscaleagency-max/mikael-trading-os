services:
  trading-os:
    build: .
    container_name: trading-os
    # on-failure:3 — startar bara om vid icke-noll exit, max 3 ggr.
    # Förhindrar oändlig restart-loop vid kraschad initial-turn (kostar credits).
    restart: on-failure:3
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # IG: inloggningsfilen finns utanför repot och måste monteras läsbar för containern (filen ska ha rättigheter 600
      # och ägas av samma uid som processen i containern). Sätt sedan IG_CREDENTIALS_FILE=/run/ig/trading-ig.json i .env.
      # - ${HOME}/.config/aiupscale/trading-ig.json:/run/ig/trading-ig.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.trading-os.rule=Host(`trading.aiupscale.agency`)
      - traefik.http.routers.trading-os.tls=true
      - traefik.http.routers.trading-os.entrypoints=web,websecure
      - traefik.http.routers.trading-os.tls.certresolver=mytlschallenge
      - traefik.http.services.trading-os.loadbalancer.server.port=3939
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
